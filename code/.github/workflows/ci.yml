name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      online:
        description: "Also run the online tests against Snowflake (needs the PAT secrets)"
        type: boolean
        default: false

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev,export]"
      # unit + offline: local git repos and DuckDB files stand in for GitHub and Horizon
      - run: python -m pytest -q tests/unit tests/offline

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build the wheel
        run: python -m pip wheel --no-deps -w dist .
      - name: Install it into a clean venv and smoke-test the CLI and package data
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/dbt-horizon version
          /tmp/clean/bin/dbt-horizon init --repo-url https://github.com/org/repo.git \
            --account org-acct --database RAW -o /tmp/dbt-horizon.yml
          /tmp/clean/bin/python -c "from importlib import resources; \
            assert resources.files('dbt_horizon').joinpath('shim', 'iceberg.sql').is_file()"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy:
    # deploy/ on a fresh Ubuntu, as on a production machine: install.sh from a tag, the systemd
    # units installed for real, one run started through systemd (offline command: inspect).
    runs-on: ubuntu-latest
    env:
      DH: /home/runner/dh                 # not under /tmp: the units use PrivateTmp
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install.sh from a tag of this commit
        run: |
          git tag ci-deploy-test
          bash deploy/install.sh --version ci-deploy-test --repo "$PWD" --home "$DH" --python python
          test "$(stat -c %a "$DH/secrets")" = 700
          cp deploy/examples/config.yml "$DH/configs/retail.prod.yml"
          echo "DBT_HORIZON_COMMAND=inspect" >> "$DH/deploy.env"
      - name: run.sh directly
        run: |
          DBT_HORIZON_HOME="$DH" "$DH/app/deploy/run.sh" retail.prod
          grep -q '"exit_code": 0' "$DH/logs/retail.prod/last_status.json"
      - name: systemd units, one run through systemd
        run: |
          sudo "$DH/app/deploy/systemd/install-units.sh" "$(id -un)" "$DH"
          sudo systemctl enable dbt-horizon@retail.prod.timer
          systemctl list-timers 'dbt-horizon*' --all --no-pager
          rm "$DH/logs/retail.prod/last_status.json"
          sudo systemctl start dbt-horizon@retail.prod.service
          sudo journalctl -u dbt-horizon@retail.prod.service --no-pager | tail -20
          grep -q '"exit_code": 0' "$DH/logs/retail.prod/last_status.json"
          sudo systemctl start dbt-horizon-cleanup.service

  terraform:
    # deploy/aws: formatted and valid (no AWS credentials needed; nothing is planned or applied)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  online:
    # Runs against the dev account: the PAT users' network policy must allow GitHub's runners.
    if: github.event_name == 'workflow_dispatch' && inputs.online
    needs: test
    runs-on: ubuntu-latest
    env:
      DBT_HORIZON_ONLINE: "1"
      SNOWFLAKE_PAT: ${{ secrets.SNOWFLAKE_PAT }}
      SNOWFLAKE_WRITE_PAT: ${{ secrets.SNOWFLAKE_WRITE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,export]"
      - run: python -m pytest -q tests/online
