name: image

# Pull requests: build and smoke-test the image. Tags v*: also publish it to GHCR as
# ghcr.io/<owner>/dbt-horizon:<tag> (+ :latest). Push to ECR: see docs/ecs.md.
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dbt-horizon:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm dbt-horizon:ci version
          # no config -> exit 2 with a clear message
          set +e; docker run --rm dbt-horizon:ci watch --once; code=$?; set -e
          test "$code" = 2
          # offline commands inside the container: clone the public example repo, dbt parse
          docker run --rm -e DBT_HORIZON_CONFIG="$(cat deploy/examples/config.yml)" dbt-horizon:ci inspect
          # baked-in DuckDB extensions load without network access
          docker run --rm --network none --entrypoint python dbt-horizon:ci -c \
            "import duckdb; c = duckdb.connect(); [c.execute(f'LOAD {e}') for e in ('httpfs', 'avro', 'iceberg')]"
      - name: Publish to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dbt-horizon
          for tag in "${GITHUB_REF_NAME}" latest; do
            docker tag dbt-horizon:ci "$image:$tag"
            docker push "$image:$tag"
          done
